name: Build Qt

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"

      - name: Run qmake
        run: qmake

      - name: Build
        run: |
          make
        if: runner.os == 'Linux'

      - name: Build (Windows)
        run: |
          nmake
        if: runner.os == 'Windows'

      - name: Deploy Qt (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          windeployqt release\*.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: |
            *.exe
            release/**
            *.AppImage
            *.so
